name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
